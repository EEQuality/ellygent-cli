name: Trusted CLI release builder (no publish)
on:
  workflow_dispatch:

permissions: {}
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
      - name: Independently build, scan and inventory all six distribution assets
        env:
          TRIVY_VERSION: ${{ vars.CLI_TRIVY_VERSION }}
          TRIVY_ARCHIVE_SHA256: ${{ vars.CLI_TRIVY_ARCHIVE_SHA256 }}
          RELEASE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/cli-release-evidence
        run: bash scripts/build-release-evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-release-evidence
          path: ${{ runner.temp }}/cli-release-evidence
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-release-evidence
          path: ${{ runner.temp }}/cli-release-evidence
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/cli-release-evidence/release-evidence.json
