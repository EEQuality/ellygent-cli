name: CLI build attestation rehearsal (untrusted for publication)
on:
  pull_request:
    branches: [main]

permissions: {}
jobs:
  build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/cli-trusted-release-gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
      - name: Independently build, scan and inventory all six distribution assets
        env:
          TRIVY_VERSION: '0.74.0'
          TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          CLI_RELEASE_DRY_RUN: 'true'
          RELEASE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/cli-release-dry-run-evidence
        run: bash scripts/build-release-evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-release-dry-run-evidence
          path: ${{ runner.temp }}/cli-release-dry-run-evidence
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-release-dry-run-evidence
          path: ${{ runner.temp }}/cli-release-dry-run-evidence
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/cli-release-dry-run-evidence/release-evidence.json
