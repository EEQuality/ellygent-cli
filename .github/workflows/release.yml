name: CLI Release Pipeline
on:
  pull_request:
  push:
    branches: [main, codex/cli-013-release-20261120]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Existing parser/refresh and installer integrity regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:installer-integrity
      - run: npm run test:checkout-bytes
      - run: npm run test:release-security-policy
      - run: npm run test:executable
        env:
          REQUIRE_CROSS_FS: '1'
      - run: npm run test:installed
        env:
          REQUIRE_CROSS_FS: '1'
  package-and-publish:
    needs: [verify, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: cli-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check immutable release identity
        run: |
          set -Eeuo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node dist/index.js --version)" = "$version"
          node --input-type=module -e 'import {RELEASE} from "./scripts/install-runtime.mjs"; import fs from "node:fs"; if(RELEASE.version!==JSON.parse(fs.readFileSync("package.json")).version)process.exit(2);'
      - name: Prepare local installer bundle
        env:
          FRONTEND_ROOT: ${{ runner.temp }}/ellygent-installer-bundle
        run: |
          mkdir -p "$FRONTEND_ROOT"
          npm run publish:frontend
      - name: Record release checksums and package
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ellygent-installer-bundle/public/cli"
          sha256sum install.sh install.ps1 install-runtime.mjs distribution-summary.json > SHA256SUMS
      - name: Prepare reviewed release notes
        run: |
          printf '%s\n' 'Pinned-source managed installers. Linux and native Windows checks passed; production QA and independent attestation are owner-waived and remain unverified.' > "$RUNNER_TEMP/release-notes.md"
      - name: Publish only after all configured gates and environment review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install.sh" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install.ps1" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install-runtime.mjs" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/distribution-summary.json" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/SHA256SUMS" "$RUNNER_TEMP/ellygent-cli-0.1.3.tgz"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Install exact release source into isolated Windows prefix
        shell: pwsh
        run: |
          $env:ELLYGENT_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP "ellygent-managed-install"
          $env:ELLYGENT_INSTALLER_RUNTIME = (Resolve-Path "scripts/install-runtime.mjs").Path
          & ./scripts/install.ps1
          $exe = Join-Path $env:ELLYGENT_INSTALL_ROOT "bin/ellygent.cmd"
          $version = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "0.1.3") { throw "Installed CLI version mismatch" }
          node --test scripts/install-integrity.node-test.mjs scripts/windows-failed-upgrade.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
