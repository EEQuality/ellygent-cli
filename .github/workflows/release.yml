name: CLI Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Publish GitHub npm installation assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CLI repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Pack npm tarball for verification
        run: npm pack

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: EEQuality/ellygent-frontend
          path: ellygent-frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend download bundle
        run: npm run publish:frontend
        env:
          FRONTEND_ROOT: ${{ github.workspace }}/ellygent-frontend

      - name: Upload frontend download bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cli-installers
          path: |
            ellygent-frontend/public/cli/
          retention-days: 7

      - id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Ellygent CLI v${{ steps.extract_version.outputs.version }}
          body: |
            ## Ellygent CLI v${{ steps.extract_version.outputs.version }}

            This release is distributed as a Node.js CLI installed directly from GitHub.

            ### Install from GitHub with npm

            ```bash
            npm install -g git+https://github.com/EEQuality/ellygent-cli.git#v${{ steps.extract_version.outputs.version }}
            ```

            ### Installer scripts

            The frontend-hosted installer scripts now install the same GitHub npm package.

            **Windows (PowerShell):**
            ```powershell
            irm https://ellygent.com/cli/install.ps1 | iex
            ```

            **Linux/macOS:**
            ```bash
            curl -fsSL https://ellygent.com/cli/install.sh | sh
            ```

            **Development installation from GitHub:**
            ```bash
            npm install -g git+https://github.com/EEQuality/ellygent-cli.git
            ```

            ### Documentation

            - [Installation Guide](https://ellygent.com/cli)
            - [Getting Started](https://ellygent.com/cli/docs/getting-started)
            - [Full Documentation](https://github.com/EEQuality/ellygent-cli#readme)
          files: |
            ellygent-cli-*.tgz
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ellygent-cli-v${{ steps.extract_version.outputs.version }}
          path: |
            dist/
            ellygent-cli-*.tgz
          retention-days: 90
