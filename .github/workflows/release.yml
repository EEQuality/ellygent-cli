name: CLI Release Pipeline
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Existing parser/refresh and installer integrity regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:installer-integrity
      - run: npm run test:release-security-policy
      - run: npm run test:executable
        env:
          REQUIRE_CROSS_FS: '1'
      - run: npm run test:installed
        env:
          REQUIRE_CROSS_FS: '1'
  security-gates:
    # No attestation/scanner configuration exists by default. Skipping this job blocks publication.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'EEQuality/ellygent-cli' && vars.CLI_RELEASE_SECURITY_GATES_CONFIGURED == 'true'
    environment: cli-release
    needs: verify
    outputs:
      install_sh_sha: ${{ steps.gate.outputs.install_sh_sha }}
      install_ps1_sha: ${{ steps.gate.outputs.install_ps1_sha }}
      install_runtime_sha: ${{ steps.gate.outputs.install_runtime_sha }}
      distribution_summary_sha: ${{ steps.gate.outputs.distribution_summary_sha }}
    runs-on: [self-hosted, ellygent-trusted-release-verifier]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify independently produced scan, SBOM and attested artifact evidence
        id: gate
        env:
          RELEASE_SECURITY_GATES_CONFIGURED: 'true'
          RELEASE_EVIDENCE_DIRECTORY: ${{ vars.CLI_RELEASE_EVIDENCE_DIRECTORY }}
          TRUSTED_GH_BINARY: ${{ vars.CLI_TRUSTED_GH_BINARY }}
          TRUSTED_GH_SHA256: ${{ vars.CLI_TRUSTED_GH_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-security-gate.mjs
  package-and-publish:
    needs: [verify, security-gates]
    if: startsWith(github.ref, 'refs/tags/') && needs.security-gates.result == 'success'
    environment: cli-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check immutable release identity
        run: |
          set -Eeuo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node dist/index.js --version)" = "$version"
          node --input-type=module -e 'import {RELEASE} from "./scripts/install-runtime.mjs"; import fs from "node:fs"; if(RELEASE.version!==JSON.parse(fs.readFileSync("package.json")).version)process.exit(2);'
      - name: Prepare local installer bundle
        env:
          FRONTEND_ROOT: ${{ runner.temp }}/ellygent-installer-bundle
        run: |
          mkdir -p "$FRONTEND_ROOT"
          npm run publish:frontend
      - name: Match every published installer byte to independently attested evidence
        env:
          INSTALL_SH_SHA: ${{ needs.security-gates.outputs.install_sh_sha }}
          INSTALL_PS1_SHA: ${{ needs.security-gates.outputs.install_ps1_sha }}
          INSTALL_RUNTIME_SHA: ${{ needs.security-gates.outputs.install_runtime_sha }}
          DISTRIBUTION_SUMMARY_SHA: ${{ needs.security-gates.outputs.distribution_summary_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {createHash} from 'node:crypto';
          for(const [name,key] of [['install.sh','INSTALL_SH_SHA'],['install.ps1','INSTALL_PS1_SHA'],['install-runtime.mjs','INSTALL_RUNTIME_SHA'],['distribution-summary.json','DISTRIBUTION_SUMMARY_SHA']]) {
            const expected=process.env[key];if(!/^[a-f0-9]{64}$/.test(expected||''))process.exit(2);
            const actual=createHash('sha256').update(fs.readFileSync(process.env.RUNNER_TEMP+'/ellygent-installer-bundle/public/cli/'+name)).digest('hex');if(actual!==expected)process.exit(2);
          }
          NODE
      - name: Prepare reviewed release notes
        run: |
          printf '%s\n' 'Pinned-source installers; see RELEASE-INTEGRITY.md for bootstrap trust and operator gates.' > "$RUNNER_TEMP/release-notes.md"
      - name: Publish only after all configured gates and environment review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install.sh" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install.ps1" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/install-runtime.mjs" "$RUNNER_TEMP/ellygent-installer-bundle/public/cli/distribution-summary.json"
